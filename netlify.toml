# Netlify Configuration for UAJ Web Tech

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Forward /api/inquiries to Netlify serverless function
[[redirects]]
  from = "/api/inquiries"
  to = "/.netlify/functions/inquiries"
  status = 200
  force = true

[[redirects]]
  from = "/api/inquiries/*"
  to = "/.netlify/functions/inquiries"
  status = 200
  force = true

# Forward /api/telegram-status to Netlify serverless function
[[redirects]]
  from = "/api/telegram-status"
  to = "/.netlify/functions/telegram-status"
  status = 200
  force = true

# Single Page Application (SPA) fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
